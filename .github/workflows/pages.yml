name: Publish legal pages

# Publishes only the privacy policy and terms to GitHub Pages (not the rest of docs/).
# One-time setup: Settings > Pages > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - docs/privacy.html
      - docs/terms.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the two pages
        run: |
          mkdir site
          cp docs/privacy.html docs/terms.html site/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
