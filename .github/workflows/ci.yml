name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  # Manual run. Tick "deploy" to also deploy the server to Fly after the tests pass.
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the server to Fly after tests pass
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - name: App unit tests
        run: npm test
      - name: Server unit tests (no database)
        run: npm --prefix server run test:unit
      - name: Server type check
        run: npm --prefix server run build

  integration:
    name: Integration tests (server + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://todo:todo@localhost:5432/todo_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run test:integration

  # Manual only: run the workflow from the Actions tab with "deploy" ticked. Never runs on push/PR.
  # Add required reviewers on the "production" environment (Settings > Environments) for an approval gate.
  deploy:
    name: Deploy server to Fly (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: [unit, integration]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --ha=false --remote-only
        working-directory: server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
