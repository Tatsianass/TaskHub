      <rect width="100" height="100" fill="#ffffff"/>
      <path d="M36.5 50.5 L45.5 59.5 L64 40.5" fill="none" stroke="#000000" stroke-width="6.8" stroke-linecap="round" stroke-linejoin="round"/>
