# One Machine: the auth rate limiter keeps its counters in memory, so more Machines would each
# count separately. Deploy with: fly deploy --ha=false
# The database is PostgreSQL: set it once with `fly secrets set DATABASE_URL=postgres://...`
app = "taskhub-api-tatianas"
primary_region = "fra"
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  # DB_PATH and [[mounts]] only serve a rollback to the pre-Postgres release; remove both with
  # the volume (specs/postgres-migration, T5.4).
  DB_PATH = "/data/app.db"
  NODE_ENV = "production"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[mounts]]
  source = "taskhub_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
